{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- فونت مشترک تمام صفحات -->
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- CSS مشترک تمام صفحات -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    <!-- عنوان اختصاصی هر صفحه -->
    <title>{% block title %}Habit Tracker{% endblock %}</title>

    <!-- محل بارگذاری CSS اختصاصی هر صفحه -->
    {% block extra_css %}{% endblock %}
  </head>

  <body class="{% block body_class %}{% endblock %}">
    <!-- محتوای اختصاصی هر صفحه -->
    {% block content %}{% endblock %}

    <!-- محل قرارگیری JavaScript اختصاصی هر صفحه -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
